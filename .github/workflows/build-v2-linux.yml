name: Build 2.x for Linux

# Tests and builds TimePlayer 2 on Ubuntu 24.04 and packages it as TimePlayer-x86_64.AppImage, whenever v2
# changes on main. The AppImage is kept as the run's artifact; for a v2 tag it is also signed and added to
# that tag's release (made on Windows by v2/build/package.ps1).
on:
  push:
    branches: [main, ports]
    tags: ['v2.*']
    paths: ['v2/**', '.github/workflows/build-v2-linux.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # wxWidgets' GTK port and its web view, the keyring, and speech to Orca.
      - name: Build tools and libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential cmake ninja-build pkg-config clang libclang-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev libsecret-1-dev libdbus-1-dev libglibmm-2.68-dev libfuse2 mpv

      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            v2/target
          key: tp-v2-Linux-${{ hashFiles('v2/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            tp-v2-Linux-

      - name: Test
        working-directory: v2
        run: cargo test --release -p timeplayer-core -p timeplayer

      - name: Fetch appimagetool and linuxdeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 1.9.1 --repo AppImage/appimagetool --pattern 'appimagetool-x86_64.AppImage' --dir "$RUNNER_TEMP"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool-x86_64.AppImage" | sha256sum -c
          chmod +x "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          # linuxdeploy collects mpv's libraries for the AppImage's own copy of mpv.
          gh release download 1-alpha-20251107-1 --repo linuxdeploy/linuxdeploy --pattern 'linuxdeploy-x86_64.AppImage' --dir "$RUNNER_TEMP"
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  $RUNNER_TEMP/linuxdeploy-x86_64.AppImage" | sha256sum -c
          chmod +x "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"

      - name: Build and package
        working-directory: v2
        run: |
          cargo build --release -p timeplayer
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool-x86_64.AppImage" LINUXDEPLOY="$RUNNER_TEMP/linuxdeploy-x86_64.AppImage" \
            sh packaging/linux/make-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: TimePlayer-Linux
          path: v2/target/release/TimePlayer-x86_64.AppImage
          retention-days: 30

      - uses: actions/setup-dotnet@v5
        if: startsWith(github.ref, 'refs/tags/')
        with:
          dotnet-version: 10.0.x

      - name: Sign it and add it to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: sh v2/packaging/attach-to-release.sh v2/target/release/TimePlayer-x86_64.AppImage
