name: Release

# Push a tag like v1.2.0 (matching <Version> in Directory.Build.props, with a CHANGELOG.md entry)
# to build, sign and publish a release. Installed copies of TimePlayer then offer it as an update.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # The same mpv build TimePlayer downloads itself (MpvManager.DefaultDownloadUrl).
      MPV_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261017/mpv-x86_64-20261017-git-dde0671072.7z
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check the tag matches the version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $version in Directory.Build.props." }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append

      - name: Get mpv and yt-dlp to bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools\mpv | Out-Null
          Invoke-WebRequest $env:MPV_URL -OutFile mpv.7z
          7z x mpv.7z -otools\mpv -y | Out-Null
          if (-not (Test-Path tools\mpv\mpv.exe)) { throw 'mpv.exe not found in the mpv archive.' }
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile tools\yt-dlp.exe

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build, test, package and sign
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: ./build/package.ps1 -ToolsFrom tools

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($env:VERSION))\s*$(.*?)(?=^## |\z)")
          if (-not $match.Success) { throw "CHANGELOG.md has no '## $env:VERSION' section." }
          $match.Groups[1].Value.Trim() | Out-File release-notes.md -Encoding utf8

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --title "TimePlayer $env:VERSION" --notes-file release-notes.md `
            release/TimePlayer_setup.exe release/TimePlayer_setup.exe.sig `
            release/TimePlayer.zip release/TimePlayer.zip.sig `
            release/TimePlayerBraille.nvda-addon release/SHA256SUMS.txt
