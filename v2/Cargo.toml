[workspace]
resolver = "3"
members = ["crates/timeplayer-core", "crates/timeplayer", "xtask"]

[workspace.package]
version = "2.0.3"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/ernie96/TimePlayer"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# quiet-list 0.1.1 with set_name added, so the main list is called by the section it shows.
[patch.crates-io]
quiet-list = { path = "vendor/quiet-list" }
