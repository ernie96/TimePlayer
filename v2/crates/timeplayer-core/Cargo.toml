[package]
name = "timeplayer-core"
description = "TimePlayer's YouTube sources, playback logic, library, settings and translations, with no user interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
regex = "1"
percent-encoding = "2"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
# Release signatures, the same Ed25519 scheme as TimePlayer 1 (updates.rs).
ed25519-dalek = "2"
# Google Takeout zips.
zip = { version = "2", default-features = false, features = ["deflate"] }
# RSS feeds, OPML and TubeRepair's XML.
quick-xml = "0.37"
sys-locale = "0.3"
# Blocking, on TimePlayer's own network threads; rustls with ring so no OpenSSL is needed anywhere.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading"] }

[target.'cfg(not(windows))'.dependencies]
keyring = { version = "3", features = ["apple-native", "linux-native-sync-persistent"] }

[dev-dependencies]
